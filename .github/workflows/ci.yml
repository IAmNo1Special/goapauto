name: CI

on:
  push:
    branches: [main, "release/*"]
  pull_request:
    branches: [main, "release/*"]

jobs:
  lint:
    uses: IAmNo1Special/actions/.github/workflows/python-ci.yml@v1
    with:
      python-version: "3.12"
      install-command: "uv sync --dev"
      run-tests: false
      lint-commands: |
        uv run ruff check src/ tests/ .github/scripts/
        uv run ruff format --check src/ tests/ .github/scripts/
        uv run mypy src/
        uv run mdformat --check docs/ README.md CONTRIBUTING.md CHANGELOG.md RELEASE_NOTES.md AGENTS.md

  test:
    needs: lint
    uses: IAmNo1Special/actions/.github/workflows/python-ci.yml@v1
    with:
      python-version: "3.12"
      runs-on: windows-latest
      install-command: "uv sync --all-extras --dev"
      run-lint: false
      test-commands: "uv run pytest tests/ -v"

  tag:
    runs-on: ubuntu-latest
    needs: [lint, test]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@v5

      - name: Push version tag and trigger release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(python3 -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          TAG="v$VERSION"
          if git ls-remote --exit-code --tags origin "$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists, nothing to do."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a "$TAG" -m "$TAG"
            git push origin "$TAG"
            echo "Pushed tag $TAG."
            # Tags pushed with GITHUB_TOKEN do not trigger workflows, so
            # dispatch the release explicitly.
            gh workflow run "Release" --ref "$TAG"
            echo "Triggered Release workflow for $TAG."
          fi
